services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: macro-data-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./.macro-data/clickhouse/data:/var/lib/clickhouse
      - ./.macro-data/clickhouse/tmp:/var/lib/clickhouse/tmp
      - ./.macro-data/clickhouse/user_files:/var/lib/clickhouse/user_files
      - ./.macro-data/clickhouse/logs:/var/log/clickhouse-server
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "${CLICKHOUSE_USER:-default}" --password "${CLICKHOUSE_PASSWORD:-}" --query 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
