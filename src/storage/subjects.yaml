  - id: equity.us.aapl
    display: "Apple (AAPL)"
    aliases:
      fred_series: []
      calendar_indicator: []
      title_regex:
        - '\bAAPL\b'
        - '\bapple(?:\s+inc)?\b'

  - id: equity.us.msft
    display: "Microsoft (MSFT)"
    aliases:
      fred_series: []
      calendar_indicator: []
      title_regex:
        - '\bMSFT\b'
        - '\bmicrosoft\b'

  - id: equity.us.nvda
    display: "Nvidia (NVDA)"
    aliases:
      fred_series: []
      calendar_indicator: []
      title_regex:
        - '\bNVDA\b'
        - '\bnvidia\b'
