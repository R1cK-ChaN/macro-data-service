        - '\bdollar index\b'

  # ----- Commodities -----

  - id: commodity.wti
    display: "WTI Crude Oil"
    aliases:
      fred_series: [DCOILWTICO]
      eia_series: [EIA_WTI]               # WTI_CRUDE in concept_map
      calendar_indicator: []
      title_regex:
