        - '\bwest texas intermediate\b'

  - id: commodity.brent
    display: "Brent Crude Oil"
    aliases:
      fred_series: [DCOILBRENTEU]
      eia_series: [EIA_BRENT]             # BRENT_CRUDE in concept_map
