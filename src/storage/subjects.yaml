  - id: commodity.gold
    display: "Gold"
    aliases:
      fred_series: [GOLDAMGBD228NLBM]
      calendar_indicator: []
      title_regex:
        - '\bgold price(?:s)?\b'
        - '\bgold futures\b'
        - '\bspot gold\b'

