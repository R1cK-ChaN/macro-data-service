# Unified subject vocabulary — issue #2 v1 (20 seed subjects).
#
# Each subject has:
#   id:              canonical flat identifier, stable across sources
#   display:         human-readable label
#   aliases:
#     fred_series:       FRED series IDs (matched against macro_data series_id)
#     calendar_indicator: calendar_events.indicator values
#     title_regex:       regex patterns matched against news/newsletter titles
#                        (word-boundary, case-insensitive, confidence 0.8)
#
# Keep flat. No parent hierarchy, no negative patterns, no disambiguation rules
# in v1 — add only when observed false positives justify the complexity.

subjects:

  # ----- US economic indicators -----

  # Geo-neutral subjects: regex matches the concept without a country prefix,
  # so the subject ID avoids claiming a specific country. If you need
  # country-scoped results, filter by `country` on the returned rows.

  - id: econ.cpi
    display: "CPI"
    aliases:
      fred_series: [CPIAUCSL, CPILFESL, CUUR0000SA0]
      calendar_indicator: ["CPI", "Core CPI", "Consumer Price Index", "CPI MoM", "CPI YoY"]
      title_regex:
        - '\bCPI\b'
        - '\bconsumer price(?:s|\s+index)\b'
        - '\bheadline inflation\b'
        - '\bcore inflation\b'

  - id: econ.ppi
    display: "PPI"
    aliases:
      fred_series: [PPIACO, PPIFIS]
      bls_series: [WPSFD4, WPSFD49116]   # PPI_US, PPI_CORE_US in concept_map
      calendar_indicator: ["PPI", "Producer Price Index", "PPI MoM", "PPI YoY"]
      title_regex:
        - '\bPPI\b'
        - '\bproducer price(?:s|\s+index)\b'

  - id: econ.us.core_pce
    display: "US Core PCE"
    aliases:
      fred_series: [PCEPILFE, PCEPI]
      calendar_indicator: ["Core PCE Price Index", "PCE Price Index", "Core PCE"]
      title_regex:
        - '\b(?:core\s+)?PCE\b'
        - '\bpersonal consumption expenditures\b'

  - id: econ.us.nfp
    display: "US Nonfarm Payrolls"
    aliases:
      fred_series: [PAYEMS]
      calendar_indicator: ["Nonfarm Payrolls", "Non-Farm Payrolls", "NFP"]
      title_regex:
        - '\bNFP\b'
        - '\bnon[- ]?farm payroll'
        - '\bjobs report\b'
        - '\bpayrolls report\b'

  - id: econ.unemployment
    display: "Unemployment Rate"
    aliases:
      fred_series: [UNRATE]
      calendar_indicator: ["Unemployment Rate"]
      title_regex:
        - '\bunemployment rate\b'
        - '\bjobless rate\b'

  - id: econ.gdp
    display: "GDP"
    aliases:
      fred_series: [GDPC1, GDP]
      calendar_indicator: ["GDP", "GDP Growth Rate", "GDP Annualized QoQ", "GDP QoQ"]
      title_regex:
        - '\bGDP\b'
        - '\bgross domestic product\b'

  - id: econ.retail_sales
    display: "Retail Sales"
    aliases:
      fred_series: [RSAFS, RRSFS]
      calendar_indicator: ["Retail Sales", "Retail Sales MoM", "Retail Sales YoY"]
      title_regex:
        - '\bretail sales\b'

  - id: econ.us.wei
    display: "US Weekly Economic Index"
    aliases:
      fred_series: [WEI]
      title_regex:
        - '\bweekly economic index\b'
        - '(?-i:\bWEI\b)'

  - id: econ.us.gscpi
    display: "Global Supply Chain Pressure Index"
    aliases:
      ny_fed_series: [GSCPI, NYFED_GSCPI]
      title_regex:
        - '\bglobal supply chain pressure index\b'
        - '(?-i:\bGSCPI\b)'

  - id: econ.us.ism_pmi
    display: "US ISM PMI"
    aliases:
      ism_series:
        - ISM_MFG_PMI_US
        - ISM_MFG_PMI_MOM_US
        - ISM_MFG_NEW_ORDERS_US
        - ISM_MFG_NEW_ORDERS_MOM_US
        - ISM_MFG_PRODUCTION_US
        - ISM_MFG_PRODUCTION_MOM_US
        - ISM_MFG_EMPLOYMENT_US
        - ISM_MFG_EMPLOYMENT_MOM_US
        - ISM_MFG_SUPPLIER_DELIVERIES_US
        - ISM_MFG_SUPPLIER_DELIVERIES_MOM_US
        - ISM_MFG_INVENTORIES_US
        - ISM_MFG_INVENTORIES_MOM_US
        - ISM_MFG_CUSTOMERS_INVENTORIES_US
        - ISM_MFG_CUSTOMERS_INVENTORIES_MOM_US
        - ISM_MFG_PRICES_US
        - ISM_MFG_PRICES_MOM_US
        - ISM_MFG_BACKLOG_OF_ORDERS_US
        - ISM_MFG_BACKLOG_OF_ORDERS_MOM_US
        - ISM_MFG_NEW_EXPORT_ORDERS_US
        - ISM_MFG_NEW_EXPORT_ORDERS_MOM_US
        - ISM_MFG_IMPORTS_US
        - ISM_MFG_IMPORTS_MOM_US
        - ISM_SERVICES_PMI_US
        - ISM_SERVICES_PMI_MOM_US
        - ISM_SERVICES_BUSINESS_ACTIVITY_US
        - ISM_SERVICES_BUSINESS_ACTIVITY_MOM_US
        - ISM_SERVICES_NEW_ORDERS_US
        - ISM_SERVICES_NEW_ORDERS_MOM_US
        - ISM_SERVICES_EMPLOYMENT_US
        - ISM_SERVICES_EMPLOYMENT_MOM_US
        - ISM_SERVICES_SUPPLIER_DELIVERIES_US
        - ISM_SERVICES_SUPPLIER_DELIVERIES_MOM_US
        - ISM_SERVICES_INVENTORIES_US
        - ISM_SERVICES_INVENTORIES_MOM_US
        - ISM_SERVICES_PRICES_US
        - ISM_SERVICES_PRICES_MOM_US
        - ISM_SERVICES_BACKLOG_OF_ORDERS_US
        - ISM_SERVICES_BACKLOG_OF_ORDERS_MOM_US
        - ISM_SERVICES_NEW_EXPORT_ORDERS_US
        - ISM_SERVICES_NEW_EXPORT_ORDERS_MOM_US
        - ISM_SERVICES_IMPORTS_US
        - ISM_SERVICES_IMPORTS_MOM_US
        - ISM_SERVICES_INVENTORY_SENTIMENT_US
        - ISM_SERVICES_INVENTORY_SENTIMENT_MOM_US
      calendar_indicator: ["ISM Manufacturing PMI", "ISM Services PMI", "ISM Non-Manufacturing PMI"]
      title_regex:
        - '\bISM\b.*\bPMI\b'
        - '\bmanufacturing PMI\b'
        - '\bservices PMI\b'
        - '\bnon[- ]manufacturing PMI\b'

  - id: industry.us.steel
    display: "US Raw Steel Production"
    aliases:
      aisi_series:
        - AISI_RAW_STEEL_PRODUCTION_US
        - AISI_RAW_STEEL_WOW_US
        - AISI_RAW_STEEL_YOY_US
      title_regex:
        - '\braw steel production\b'
        - '\bsteel output\b'
        - '\bsteel production\b'

  - id: housing.us.homeownership
    display: "US Homeownership Rate"
    aliases:
      fred_series: [RHORUSQ156N]
      title_regex:
        - '\bhomeownership rate\b'

  - id: housing.us.rental_vacancy
    display: "US Rental Vacancy Rate"
    aliases:
      fred_series: [RRVRUSQ156N]
      title_regex:
        - '\brental vacancy rate\b'

  - id: housing.us.homeowner_vacancy
    display: "US Homeowner Vacancy Rate"
    aliases:
      fred_series: [RHVRUSQ156N]
      title_regex:
        - '\bhomeowner vacancy rate\b'

  # ----- Central bank rates -----

  - id: rate.us.fed_funds
    display: "US Fed Funds Rate"
    aliases:
      fred_series: [FEDFUNDS, DFF]
      calendar_indicator: ["Fed Interest Rate Decision", "FOMC Rate Decision", "Federal Funds Rate"]
      title_regex:
        - '\bfed funds\b'
        - '\bfederal funds rate\b'
        - '\bFOMC\b'
        - '\bfed(?:eral reserve)?\s+rate\b'

  - id: rate.eu.ecb_depo
    display: "ECB Deposit Rate"
    aliases:
      fred_series: [ECBDFR]
      calendar_indicator: ["ECB Interest Rate Decision", "Deposit Facility Rate"]
      title_regex:
        - '\bECB\b'
        - '\beuropean central bank\b'
        - '\bdeposit (?:facility )?rate\b'

  - id: rate.jp.boj
    display: "BOJ Policy Rate"
    aliases:
      fred_series: [IRSTCI01JPM156N]
      calendar_indicator: ["BoJ Interest Rate Decision", "BOJ Rate Decision"]
      title_regex:
        - '\bBOJ\b'
        - '\bbank of japan\b'

  # ----- Sovereign yields -----

  - id: rate.us.2y
    display: "US 2Y Treasury Yield"
    aliases:
      fred_series: [DGS2]
      calendar_indicator: []
      title_regex:
        - '\b2[- ]?year (?:treasury|yield|note)\b'
        - '\btwo[- ]year (?:treasury|yield|note)\b'
        - '\b2Y\b'

  - id: rate.us.10y
    display: "US 10Y Treasury Yield"
    aliases:
      fred_series: [DGS10]
      calendar_indicator: []
      title_regex:
        - '\b10[- ]?year (?:treasury|yield|note)\b'
        - '\bten[- ]year (?:treasury|yield|note)\b'
        - '\b10Y\b'

  - id: rate.de.govt
    display: "Germany Government Yields"
    aliases:
      bundesbank_series:
        - BUNDESBANK_DE_GOVT_2Y
        - BUNDESBANK_DE_GOVT_5Y
        - BUNDESBANK_DE_GOVT_7Y
        - BUNDESBANK_DE_GOVT_10Y
        - BUNDESBANK_DE_GOVT_15Y
        - BUNDESBANK_DE_GOVT_30Y
      calendar_indicator: []
      title_regex:
        - '\b(?:german|germany)\s+(?:government\s+)?(?:bond|bund)\s+yield'
        - '\bBund(?:esanleihe)?\b'

  - id: rate.jp.govt
    display: "Japan Government Yields"
    aliases:
      mof_jp_series:
        - MOF_JP_GOVT_1Y
        - MOF_JP_GOVT_2Y
        - MOF_JP_GOVT_3Y
        - MOF_JP_GOVT_4Y
        - MOF_JP_GOVT_5Y
        - MOF_JP_GOVT_6Y
        - MOF_JP_GOVT_7Y
        - MOF_JP_GOVT_8Y
        - MOF_JP_GOVT_9Y
        - MOF_JP_GOVT_10Y
        - MOF_JP_GOVT_15Y
        - MOF_JP_GOVT_20Y
        - MOF_JP_GOVT_25Y
        - MOF_JP_GOVT_30Y
        - MOF_JP_GOVT_40Y
      calendar_indicator: []
      title_regex:
        - '\b(?:japan|japanese)\s+(?:government\s+)?bond\s+yield'
        - '\bJGB(?:s)?\b'

  # ----- Reference rates (NY Fed) -----

  # NY Fed rates store two alias forms for the same series: the natural
  # name (SOFR/EFFR/OBFR) that humans and news titles use, plus the
  # NYFED_-prefixed form that macro-data-service's concept_map records
  # as provider_series_id. Listing both lets the query-time bridge
  # resolve either direction without a normalization layer.

  - id: rate.us.sofr
    display: "US SOFR"
    aliases:
      ny_fed_series: [SOFR, NYFED_SOFR]
      title_regex:
        - '\bSOFR\b'
        - '\bsecured overnight financing rate\b'

  - id: rate.us.effr
    display: "US EFFR"
    aliases:
      ny_fed_series: [EFFR, NYFED_EFFR]
      title_regex:
        - '\bEFFR\b'
        - '\beffective fed(?:eral)? funds rate\b'

  - id: rate.us.obfr
    display: "US OBFR"
    aliases:
      ny_fed_series: [OBFR, NYFED_OBFR]
      title_regex:
        - '\bOBFR\b'
        - '\bovernight bank funding rate\b'

  - id: rate.us.fedwatch
    display: "US FedWatch (rate expectations)"
    aliases:
      fedwatch_series: [FEDWATCH_MIDPOINT]
      title_regex:
        - '\bFedWatch\b'
        - '\brate expectation'
        - '\bimplied (?:fed )?rate'
        - '\bFOMC probabilit'

  # ----- Volatility & FX -----

  - id: vol.vix
    display: "VIX"
    aliases:
      fred_series: [VIXCLS]
      calendar_indicator: []
      title_regex:
