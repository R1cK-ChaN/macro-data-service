<div class="TRS_Editor">
<p>From January to March 2026, the national investment in fixed assets (excluding rural households) was 10,270.8 billion yuan, a year-on-year increase of 1.7%, of which the investment in projects (excluding real estate development) increased by 6.0 percent.</p>
